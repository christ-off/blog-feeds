AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Blog feeds - fetches the latest post from each recommended blog's RSS/Atom feed
  daily, outputs JSON to the static site S3 bucket.

Parameters:
  WebsiteBucket:
    Type: String
    Description: S3 bucket hosting the static website
  DistributionId:
    Type: String
    Description: CloudFront distribution ID (for cache invalidation)

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 120
    MemorySize: 256

Resources:
  BlogFeedsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${BlogFeedsFunction}'
      RetentionInDays: 30

  BlogFeedsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.handler
      CodeUri: src/
      Description: Fetch latest post from each blog feed and write blogs.json
      Environment:
        Variables:
          WEBSITE_BUCKET: !Ref WebsiteBucket
          DISTRIBUTION_ID: !Ref DistributionId
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:PutObjectAcl
              Resource: !Sub 'arn:aws:s3:::${WebsiteBucket}/about/data/*'
        - Statement:
            - Effect: Allow
              Action:
                - cloudfront:CreateInvalidation
              Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistributionId}'
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(15 6 * * ? *)
            Description: Fetch latest blog posts daily at 06:15 UTC

Outputs:
  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt BlogFeedsFunction.Arn
  FunctionName:
    Description: Lambda function name (for manual invocation)
    Value: !Ref BlogFeedsFunction
